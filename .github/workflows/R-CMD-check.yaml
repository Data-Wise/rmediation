# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Expensive: runs for main and releases only (CI policy; PRs and pushes to dev are gated locally by
# scripts/check-local.sh). `workflow_dispatch` runs it on demand from any branch.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Routine release-R jobs: full Suggests (incl. OpenMx/medfit) install
          # fast from prebuilt binaries via RSPM.
          - {os: macos-latest,   r: 'release', pkg-deps: '"all"',                       extra: 'any::rcmdcheck', depends-only: 'false'}
          - {os: windows-latest, r: 'release', pkg-deps: '"all"',                       extra: 'any::rcmdcheck', depends-only: 'false'}
          - {os: ubuntu-latest,   r: 'release', pkg-deps: '"all"',                      extra: 'any::rcmdcheck, any::pkgload', depends-only: 'false'}
          # Routine R-devel job: skip OpenMx/medfit (no R-devel binaries, build
          # from source = 15-25 min). Both are Suggests with requireNamespace()
          # guards + skip_if_not_installed() tests, so the package still checks
          # cleanly without them; the full Suggests set (incl. OpenMx/medfit)
          # is exercised by the pre-submission r-hub/win-builder pass instead.
          # depends-only: this leg also runs with _R_CHECK_DEPENDS_ONLY_=true, so examples and tests see only
          # Depends/Imports/LinkingTo packages (plus the test framework) and an unguarded use of a Suggests
          # package fails here (scripts/check-ci-policy.R enforces the setting; locally:
          # scripts/check-local.sh --depends-only).
          - {os: ubuntu-latest,   r: 'devel',   pkg-deps: '"hard"',                     extra: 'any::rcmdcheck, any::testthat, any::lavaan, any::knitr, any::rmarkdown', depends-only: 'true'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.depends-only }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ matrix.config.extra }}
          dependencies: ${{ matrix.config.pkg-deps }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual")'

      # Issue #84 gate: known answer (OpenMx/OpenMx#433) plus a planted defect, per optimizer; 2 s. It needs OpenMx,
      # so a missing OpenMx fails the job, and it fails when no optimizer exercised the check. No path filter and no
      # continue-on-error (scripts/check-ci-policy.R enforces both). Locally: scripts/check-local.sh runs it first.
      - name: "Issue #84 gate (OpenMx constraint not enforced)"
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: Rscript scripts/verify-constraint-not-enforced.R

      - name: Verify installed OpenMx namespace load orders
        if: matrix.config.r == 'release'
        shell: bash
        run: |
          gate_lib=$(mktemp -d)
          R CMD INSTALL --library="$gate_lib" .
          Rscript scripts/check-openmx-load.R "$gate_lib" RMediation
          Rscript scripts/check-openmx-load.R "$gate_lib" OpenMx
