# Advisory style check (plan T1-T2, 2026-10-31): lintr with the repository's `.lintr` (120 columns). It is cosmetic only
# and not a required status check. Like the other non-cheap workflows it runs for main and releases only, and on
# `workflow_dispatch`; PRs to and pushes to dev start nothing (scripts/check-ci-policy.R enforces that).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0L) {
            stop(length(lints), " lint finding(s); see the log above.", call. = FALSE)
          }
        shell: Rscript {0}
